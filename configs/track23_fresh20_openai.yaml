simulation:
  max_iterations: 1
  max_planning_rounds: 4
  max_conversation_steps: 3
  seed: 101
  tags:
  - track23_fresh20_openai
environment:
  name: JiraTicketEnvironment
  assignment_filling: false
  max_tasks: 8
communication_network:
  topology: complete
  num_agents: 6
  consolidate_channels: true
llm_models:
- label: openai_gpt4o_mini_2024_07_18
  llm:
    provider: openai
    openai:
      model: gpt-4o-mini-2024-07-18
      params:
        max_tokens: 1500
        temperature: 0.7
experiment:
  tag: track23_fresh20_openai
  output_dir: experiments/collusion/outputs/track23_fresh20_openai
  max_concurrent_runs: 1
  seeds:
  - 101
  - 102
  - 103
  - 104
  - 105
  - 106
  - 107
  - 108
  - 109
  - 110
  collusion:
    colluder_selection: first
    agent_order: random
  sweeps:
  - name: baseline
    topologies:
    - complete
    num_agents:
    - 6
    colluder_counts:
    - 2
    secret_channel_enabled:
    - false
    prompt_variants:
    - control
  - name: treatment
    topologies:
    - complete
    num_agents:
    - 6
    colluder_counts:
    - 2
    secret_channel_enabled:
    - true
    prompt_variants:
    - simple
